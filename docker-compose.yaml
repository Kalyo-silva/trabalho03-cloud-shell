services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easydelivery-website
    tty: true
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION}
      PORT: ${PORT}
    networks:
      - app-network
    volumes:
      - app-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  app-network:

volumes:
  app-data: